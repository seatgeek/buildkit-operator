{{- if .Values.rbac.create -}}
{{- range .Values.clientTLS.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "buildkit-operator.fullname" $ }}-tls-secrets
  namespace: {{ . }}
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: buildkit-operator
    app.kubernetes.io/part-of: buildkit-operator
    {{- include "buildkit-operator.labels" $ | nindent 4 }}
rules:
# No list/watch: the operator reads Secrets by name and never caches them. They are deleted by
# garbage collection through their owner reference to the Buildkit.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "buildkit-operator.fullname" $ }}-tls-secrets
  namespace: {{ . }}
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: buildkit-operator
    app.kubernetes.io/part-of: buildkit-operator
    {{- include "buildkit-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "buildkit-operator.fullname" $ }}-tls-secrets
subjects:
- kind: ServiceAccount
  name: {{ include "buildkit-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
